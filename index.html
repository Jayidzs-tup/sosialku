    <!-- ============================================= -->
    <!-- SCRIPT ANIMASI (Zoom Unlock + Spring Tombol) -->
    <!-- ============================================= -->
    <script>
    window.addEventListener('load', () => {

        const card      = document.querySelector('.card');
        const profile   = document.querySelector('.profile-wrapper');
        const deskripsi = document.querySelector('.deskripsi');
        const allBtns   = document.querySelectorAll('.btn');

        // ==================================================
        // 1. ENTRANCE — Zoom Unlock ala iPhone
        // ==================================================
        const entrance = [
            { el: card,      from: 'scale(1.15)',                    to: 'scale(1)',                    delay: 0   },
            { el: profile,   from: 'translateX(-50%) scale(1.15)',   to: 'translateX(-50%) scale(1)',   delay: 250 },
            { el: deskripsi, from: 'translateY(-120px) scale(1.15)', to: 'translateY(-120px) scale(1)', delay: 500 }
        ];

        entrance.forEach(({ el, from, to, delay }) => {
            if (!el) return;
            const anim = el.animate(
                [
                    { opacity: 0, transform: from },
                    { opacity: 1, transform: to }
                ],
                {
                    duration: 900,
                    delay: delay,
                    easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                    fill: 'both'
                }
            );
            anim.onfinish = () => anim.cancel();
        });

        // Tombol muncul berurutan (stagger)
        allBtns.forEach((btn, i) => {
            const anim = btn.animate(
                [
                    { opacity: 0, transform: 'translateY(25px) scale(0.9)' },
                    { opacity: 1, transform: 'translateY(0) scale(1)' }
                ],
                {
                    duration: 700,
                    delay: 750 + (i * 150),
                    easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
                    fill: 'both'
                }
            );
            anim.onfinish = () => anim.cancel();
        });

        // ==================================================
        // 2. PRESS — Maju mundur + spring balik
        // ==================================================
        allBtns.forEach(btn => {
            let pressAnim = null;

            btn.addEventListener('pointerdown', () => {
                if (pressAnim) pressAnim.cancel();
                pressAnim = btn.animate(
                    [{ transform: 'scale(1)' }, { transform: 'scale(0.9)' }],
                    { duration: 120, easing: 'ease-out', fill: 'forwards' }
                );
            });

            const release = () => {
                if (!pressAnim) return;
                pressAnim.cancel();
                pressAnim = btn.animate(
                    [{ transform: 'scale(0.9)' }, { transform: 'scale(1)' }],
                    { duration: 350, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'forwards' }
                );
                pressAnim.onfinish = () => {
                    pressAnim.cancel();
                    pressAnim = null;
                };
            };

            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointerleave', release);
            btn.addEventListener('pointercancel', release);
        });

    });
    </script>
